<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDNIGHT HOSPITAL</title>

<link rel="stylesheet" href="style.css">
</head>


<body tabindex="0">


<div class="wrap">


    <div class="topbar">

        <div class="brand">

            <span class="brand-mark"></span>

            <div>
                <div class="title">
                    MIDNIGHT HOSPITAL
                </div>

                <div
                    class="subtitle"
                    id="subtitleText">
                    한밤중의 병원에서 탈출하라
                </div>
            </div>

        </div>

        <div class="topbar-tag">
            NIGHT SHIFT · 3 STAGES
        </div>

    </div>


    <div class="layout">


        <div class="game-area">


            <div id="messageBar">
                게임을 불러오는 중입니다.
            </div>


            <!-- 게임 화면 + 결과 창 -->
            <div class="screen">

                <canvas
                    id="game"
                    width="1056"
                    height="640"
                    tabindex="0">
                </canvas>


                <!-- GAME OVER / CLEAR -->
                <div
                    class="overlay"
                    id="overlay">

                    <div
                        class="overlay-box"
                        id="overlayBox">
                    </div>

                </div>

            </div>


            <div class="help">

                <div class="help-keys">

                    <div>
                        <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
                        / <kbd>WASD</kbd>
                        이동
                    </div>

                    <div>
                        <kbd>Shift</kbd> + 이동
                        달리기
                    </div>

                    <div>
                        <kbd>Space</kbd> / <kbd>Enter</kbd>
                        상호작용 · 숨기 · 미니게임 입력
                    </div>

                    <div>
                        <kbd>R</kbd>
                        현재 스테이지 재시작
                    </div>

                </div>


                <button
                    class="restart-button"
                    onclick="restartStage()">

                    ↻ 스테이지<br>다시 시작

                </button>


                <div class="dpad">

                    <button class="empty">.</button>

                    <button
                        onmousedown="pressDirection('ArrowUp')"
                        onmouseup="releaseDirection('ArrowUp')"
                        onmouseleave="releaseDirection('ArrowUp')">
                        ↑
                    </button>

                    <button class="empty">.</button>


                    <button
                        onmousedown="pressDirection('ArrowLeft')"
                        onmouseup="releaseDirection('ArrowLeft')"
                        onmouseleave="releaseDirection('ArrowLeft')">
                        ←
                    </button>


                    <button
                        class="dpad-action"
                        onclick="interact()">
                        ◎
                    </button>


                    <button
                        onmousedown="pressDirection('ArrowRight')"
                        onmouseup="releaseDirection('ArrowRight')"
                        onmouseleave="releaseDirection('ArrowRight')">
                        →
                    </button>


                    <button class="empty">.</button>


                    <button
                        onmousedown="pressDirection('ArrowDown')"
                        onmouseup="releaseDirection('ArrowDown')"
                        onmouseleave="releaseDirection('ArrowDown')">
                        ↓
                    </button>


                    <button class="empty">.</button>

                </div>

            </div>


            <!-- =================================================
                 프롤로그
            ================================================== -->

            <div id="prologueOverlay">

                <div class="prologue-box">


                    <div class="prologue-top">

                        <div class="prologue-stage">
                            NIGHT SHIFT GUIDE
                        </div>

                        <div
                            class="prologue-stage"
                            id="prologuePageNumber">
                            1 / 5
                        </div>

                    </div>


                    <div
                        class="prologue-title"
                        id="prologueTitle">
                    </div>


                    <div
                        class="prologue-text"
                        id="prologueText">
                    </div>


                    <!--
                    프롤로그에서 게임 속 물체를
                    실제 도트 스프라이트로 보여주는 Canvas
                    -->
                    <canvas
                        id="tutorialCanvas"
                        width="780"
                        height="245">
                    </canvas>


                    <div
                        class="tutorial-tip"
                        id="tutorialTip">
                    </div>


                    <div class="prologue-buttons">

                        <button
                            class="secondary-button"
                            id="previousTutorialButton"
                            onclick="previousTutorialPage()">

                            ← 이전

                        </button>


                        <button
                            id="nextTutorialButton"
                            onclick="nextTutorialPage()">

                            다음 →

                        </button>

                    </div>


                </div>

            </div>


        </div>


        <!-- =====================================================
             오른쪽 상태창
        ====================================================== -->

        <div class="side">


            <div class="card">

                <h3>
                    <span data-sprite="icon_cross" data-scale="2"></span>
                    현재 스테이지
                </h3>

                <div
                    class="stage-card"
                    id="stageBox">
                    프롤로그를 넘기면 근무가 시작됩니다.
                </div>

            </div>


            <div class="card">

                <h3>
                    <span data-sprite="icon_target" data-scale="2"></span>
                    미션
                </h3>

                <div
                    class="objective"
                    id="objectiveBox">
                    -
                </div>

            </div>


            <div class="card">

                <h3>
                    <span data-sprite="heart" data-scale="2"></span>
                    상태
                </h3>

                <div id="statusBox">
                </div>

            </div>


            <div class="card">

                <h3 id="progressTitle">
                    진행
                </h3>

                <div id="progressBox">
                </div>

            </div>


            <div class="card log-card">

                <h3>
                    <span data-sprite="icon_doc" data-scale="2"></span>
                    야간 기록
                </h3>

                <div id="logBox">
                </div>

            </div>


        </div>


    </div>

</div>


<script src="assets/atlas.js"></script>
<script src="sprites.js"></script>
<script src="script.js"></script>

</body>
</html>
