
<!DOCTYPE html>
<!--
    ============================================================
    MIDNIGHT HOSPITAL - index.html
    ============================================================

    [파일의 역할]
    이 파일은 MIDNIGHT HOSPITAL 게임의 웹페이지 구조를
    정의하는 HTML 파일이다.

    HTML은 게임 화면에 어떤 요소가 배치될지 결정하며,
    실제 게임 동작과 화면 디자인은 다른 파일에서 담당한다.

    [파일별 역할]
    1. index.html
       - 게임 화면과 버튼 등 웹페이지의 기본 구조 구성
       - 게임 진행 상황을 표시할 영역 생성
       - 프롤로그와 결과 화면을 표시할 영역 생성

    2. style.css
       - 배경색, 글자 크기, 버튼 디자인 등 시각적 요소 설정
       - 화면 배치와 반응형 디자인 담당

    3. script.js
       - 캐릭터 이동, 적의 움직임, 충돌 판정 등 게임 기능 담당
       - 키보드 입력과 버튼 클릭 처리
       - 스테이지 진행과 미션 수행 관리

    4. sprites.js / assets/atlas.js
       - 게임에 사용되는 스프라이트 관련 데이터 및 기능 제공

    [전체 페이지 구성]
    상단 : 게임 제목 및 안내 문구
    왼쪽 : 게임 화면, 조작 방법, 프롤로그
    오른쪽 : 스테이지, 미션, 상태, 진행도, 기록
    ============================================================
-->

<!--
    lang="ko"
    웹페이지의 기본 언어가 한국어임을 나타낸다.
-->
<html lang="ko">

<head>

<!--
    ============================================================
    1. HEAD 영역 - 웹페이지 기본 설정
    ============================================================

    head 태그에는 화면에 직접 표시되는 게임 내용이 아니라
    브라우저가 웹페이지를 해석하는 데 필요한 정보를 작성한다.
-->

<!--
    UTF-8 문자 인코딩 설정

    한글, 영어, 특수문자 등을 정상적으로 표시하기 위해 사용한다.
    이 설정이 없으면 한글이 깨져 보일 수 있다.
-->
<meta charset="UTF-8">

<!--
    화면 크기 설정

    width=device-width
    : 웹페이지의 너비를 사용 중인 기기의 화면 너비에 맞춘다.

    initial-scale=1
    : 페이지를 처음 열었을 때 확대 비율을 100%로 설정한다.

    모바일이나 태블릿에서도 화면 크기에 맞게
    웹페이지가 표시되도록 돕는다.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
    웹페이지 제목

    브라우저 탭에 표시되는 이름을 설정한다.
    게임 화면 내부의 제목과는 별개의 요소이다.
-->
<title>MIDNIGHT HOSPITAL</title>

<!--
    외부 CSS 파일 연결

    rel="stylesheet"
    : 연결하는 파일이 스타일시트임을 나타낸다.

    href="style.css"
    : 같은 폴더에 있는 style.css 파일을 불러온다.

    HTML은 화면의 구조를 담당하고,
    CSS는 색상, 크기, 위치 등의 디자인을 담당한다.
-->
<link rel="stylesheet" href="style.css">

</head>


<!--
    ============================================================
    2. BODY 영역 - 실제 웹페이지 내용
    ============================================================

    body 태그 내부에는 사용자가 화면에서 보게 되는
    게임 인터페이스의 구성 요소들이 들어간다.

    tabindex="0"
    : body 요소가 키보드 포커스를 받을 수 있도록 한다.

    키보드 포커스는 사용자의 키 입력을 처리할 때
    중요한 개념이다.

    실제 키보드 입력에 따른 캐릭터 이동 등의 동작은
    JavaScript에서 처리한다.
-->
<body tabindex="0">


<!--
    ============================================================
    3. 전체 페이지를 감싸는 컨테이너
    ============================================================

    class="wrap"

    게임 페이지의 전체 내용을 하나로 묶는 영역이다.

    CSS에서 wrap 클래스를 이용하면
    전체 페이지의 너비, 여백, 정렬 등을
    통일하여 관리할 수 있다.
-->
<div class="wrap">


    <!--
        ========================================================
        4. 상단 제목 표시 영역
        ========================================================

        class="topbar"

        게임 화면의 가장 위쪽에 배치되는 영역이다.

        게임 제목, 부제목, 스테이지 관련 안내 문구 등을
        표시하기 위한 구조이다.
    -->
    <div class="topbar">

        <!--
            게임 브랜드 영역

            게임 로고 역할을 하는 장식과
            제목 및 부제목을 하나로 묶는다.
        -->
        <div class="brand">

            <!--
                브랜드 장식 요소

                span은 짧은 텍스트나 장식 요소를
                표현할 때 사용할 수 있는 인라인 요소이다.

                이 요소는 내부 텍스트가 없으며,
                CSS의 brand-mark 스타일을 통해
                시각적 장식으로 표현할 수 있다.
            -->
            <span class="brand-mark"></span>

            <!--
                제목과 부제목을 묶는 영역
            -->
            <div>

                <!--
                    게임의 메인 제목

                    class="title"을 통해
                    CSS에서 글꼴, 크기, 색상 등을 지정한다.
                -->
                <div class="title">
                    MIDNIGHT HOSPITAL
                </div>

                <!--
                    게임 부제목

                    class="subtitle"
                    : 부제목에 적용할 CSS 스타일을 지정한다.

                    id="subtitleText"
                    : JavaScript에서 이 요소를 찾아
                      문구를 변경할 수 있도록 하는 고유 식별자이다.

                    class는 여러 요소에 사용할 수 있지만,
                    id는 일반적으로 문서 안에서 고유하게 사용한다.
                -->
                <div
                    class="subtitle"
                    id="subtitleText">
                    한밤중의 병원에서 탈출하라
                </div>

            </div>

        </div>

        <!--
            게임의 기본 안내 태그

            NIGHT SHIFT
            : 게임의 야간 근무 콘셉트를 나타낸다.

            3 STAGES
            : 게임이 총 3개의 스테이지로 구성되어 있음을 안내한다.

            이 문구는 현재 스테이지를 자동으로 계산하는 코드가
            아니라 화면에 표시되는 고정 텍스트이다.
        -->
        <div class="topbar-tag">
            NIGHT SHIFT · 3 STAGES
        </div>

    </div>


    <!--
        ========================================================
        5. 메인 레이아웃
        ========================================================

        class="layout"

        게임의 주요 화면을 배치하는 영역이다.

        내부에는 두 가지 큰 영역이 존재한다.

        1. game-area : 게임 플레이 화면
        2. side      : 게임 상태 및 미션 정보

        두 영역의 실제 배치 방식은 CSS에서 결정한다.
    -->
    <div class="layout">


        <!--
            ====================================================
            6. 왼쪽 게임 플레이 영역
            ====================================================

            class="game-area"

            실제 게임 화면과 조작 버튼,
            프롤로그 안내창을 포함하는 영역이다.
        -->
        <div class="game-area">


            <!--
                ------------------------------------------------
                6-1. 게임 메시지 표시창
                ------------------------------------------------

                id="messageBar"

                게임 중 사용자에게 안내 메시지를
                표시하기 위한 영역이다.

                예를 들어 JavaScript에서 이 요소의
                텍스트를 변경하면 게임 진행에 따른
                새로운 안내 문구를 표시할 수 있다.

                초기에는 게임을 불러오는 중이라는
                메시지를 표시한다.
            -->
            <div id="messageBar">
                게임을 불러오는 중입니다.
            </div>


            <!-- 게임 화면 + 결과 창 -->

            <!--
                ------------------------------------------------
                6-2. 게임 화면 컨테이너
                ------------------------------------------------

                class="screen"

                실제 게임이 그려지는 canvas와
                게임 종료 또는 클리어 결과를 표시하는
                overlay를 함께 묶는 영역이다.

                두 요소를 하나의 컨테이너에 배치하면
                결과창을 게임 화면 위에 겹쳐 표시하는
                인터페이스를 구현할 수 있다.
            -->
            <div class="screen">

                <!--
                    ============================================
                    CANVAS - 실제 게임이 그려지는 영역
                    ============================================

                    canvas는 JavaScript를 이용해
                    그림, 도형, 이미지 등을 그릴 수 있는
                    HTML 요소이다.

                    일반적인 HTML 요소가 버튼이나 문장을
                    배치하는 데 사용된다면,

                    canvas는 게임 속 캐릭터, 배경,
                    장애물 등의 그래픽을 그리는 데 사용된다.

                    id="game"
                    : JavaScript에서 게임 화면을
                      찾아 사용할 수 있도록 지정한 ID

                    width="1056"
                    : 캔버스 내부의 가로 해상도 1056픽셀

                    height="640"
                    : 캔버스 내부의 세로 해상도 640픽셀

                    tabindex="0"
                    : 캔버스가 키보드 포커스를
                      받을 수 있도록 설정

                    주의:
                    canvas의 width와 height 속성은
                    내부 그림 좌표계의 크기를 설정한다.

                    실제 화면에서 보이는 크기는
                    CSS에 의해 달라질 수 있다.
                -->
                <canvas
                    id="game"
                    width="1056"
                    height="640"
                    tabindex="0">
                </canvas>


                <!-- GAME OVER / CLEAR -->

                <!--
                    ============================================
                    게임 결과 표시용 오버레이
                    ============================================

                    overlay는 기존 게임 화면 위에
                    다른 화면을 겹쳐 표시할 때 사용하는 구조이다.

                    게임 오버 또는 스테이지 클리어와 같은
                    결과 화면을 표시하기 위해 준비되어 있다.

                    id="overlay"
                    : JavaScript에서 오버레이 요소를
                      찾아 표시 상태 등을 제어하기 위한 ID

                    실제 표시 여부와 동작 방식은
                    CSS 및 JavaScript 코드에 따라 결정된다.
                -->
                <div
                    class="overlay"
                    id="overlay">

                    <!--
                        결과창 내부 내용 영역

                        id="overlayBox"

                        게임 결과에 따른 제목, 설명,
                        버튼 등의 내용을 표시하기 위한 공간이다.

                        현재 HTML에는 고정된 내용이 없으므로
                        JavaScript에서 내용을 생성하거나
                        변경할 수 있도록 구성되어 있다.
                    -->
                    <div
                        class="overlay-box"
                        id="overlayBox">
                    </div>

                </div>

            </div>


            <!--
                ------------------------------------------------
                6-3. 게임 조작 방법 안내 영역
                ------------------------------------------------

                class="help"

                사용자가 게임을 조작하는 방법을
                확인할 수 있도록 만든 영역이다.

                키보드 조작법과 재시작 버튼,
                방향키 형태의 조작 버튼을 포함한다.
            -->
            <div class="help">

                <!--
                    키보드 조작 방법을 묶는 영역

                    class="help-keys"

                    각 키의 역할을 사용자에게 안내한다.

                    kbd 태그는 키보드 입력을
                    나타낼 때 사용하는 HTML 요소이다.

                    실제 키 입력을 처리하는 기능은
                    JavaScript에 구현되어야 한다.
                -->
                <div class="help-keys">

                    <!--
                        캐릭터 이동 방법

                        방향키 또는 WASD 키를 사용하여
                        캐릭터를 이동할 수 있음을 안내한다.
                    -->
                    <div>
                        <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
                        / <kbd>WASD</kbd>
                        이동
                    </div>

                    <!--
                        달리기 조작 방법

                        Shift 키를 누른 상태에서
                        이동 키를 함께 사용하도록 안내한다.

                        실제 이동 속도 변경은
                        JavaScript의 게임 로직에서 처리한다.
                    -->
                    <div>
                        <kbd>Shift</kbd> + 이동
                        달리기
                    </div>

                    <!--
                        상호작용 조작 방법

                        Space 또는 Enter 키를 이용하여
                        게임 속 물체와 상호작용하거나
                        숨기 및 미니게임 입력을 수행하도록 안내한다.

                        상황에 따라 같은 키가
                        다른 기능을 수행할 수 있다.
                    -->
                    <div>
                        <kbd>Space</kbd> / <kbd>Enter</kbd>
                        상호작용 · 숨기 · 미니게임 입력
                    </div>

                    <!--
                        현재 스테이지 재시작 안내

                        R 키를 사용하여 현재 스테이지를
                        다시 시작할 수 있음을 안내한다.
                    -->
                    <div>
                        <kbd>R</kbd>
                        현재 스테이지 재시작
                    </div>

                </div>


                <!--
                    ============================================
                    스테이지 재시작 버튼
                    ============================================

                    button 태그는 사용자가 클릭할 수 있는
                    버튼을 생성하는 HTML 요소이다.

                    class="restart-button"
                    : CSS에서 버튼 디자인을 지정한다.

                    onclick="restartStage()"
                    : 사용자가 버튼을 클릭하면
                      restartStage() 함수를 호출한다.

                    restartStage() 함수의 실제 동작은
                    JavaScript 파일에 정의되어 있어야 한다.

                    여기서는 함수 실행을 요청할 뿐,
                    재시작 과정 자체를 구현하지 않는다.

                    br 태그는 버튼의 문구를
                    두 줄로 나누기 위해 사용한다.
                -->
                <button
                    class="restart-button"
                    onclick="restartStage()">

                    ↻ 스테이지<br>다시 시작

                </button>


                <!--
                    ============================================
                    화면 내 방향키 조작 패널
                    ============================================

                    class="dpad"

                    D-pad는 방향 조작 패드를 의미한다.

                    키보드 외에도 화면에 표시된
                    방향 버튼을 이용할 수 있도록 구성한다.

                    위, 아래, 왼쪽, 오른쪽 방향 버튼과
                    중앙의 상호작용 버튼이 존재한다.

                    각 버튼은 JavaScript 함수를 호출하여
                    입력 상태를 전달한다.
                -->
                <div class="dpad">

                    <!--
                        첫 번째 줄 왼쪽 빈칸

                        방향키를 십자 형태로 배치하기 위해
                        사용되는 자리 채움 요소이다.

                        실제로 화면에서 어떻게 보이는지는
                        CSS의 empty 클래스 설정에 따라 달라진다.
                    -->
                    <button class="empty">.</button>

                    <!--
                        위쪽 이동 버튼

                        onmousedown
                        : 마우스 버튼을 누르는 순간 실행된다.

                        pressDirection('ArrowUp')
                        : 위쪽 방향 입력을 시작하도록
                          JavaScript 함수를 호출한다.

                        onmouseup
                        : 마우스 버튼을 놓았을 때 실행된다.

                        onmouseleave
                        : 마우스 포인터가 버튼 영역을
                          벗어났을 때 실행된다.

                        releaseDirection('ArrowUp')
                        : 위쪽 방향 입력을 해제하도록
                          JavaScript 함수를 호출한다.

                        이 구조는 버튼을 누르고 있는 동안의
                        입력을 처리하기 위해 사용될 수 있다.
                    -->
                    <button
                        onmousedown="pressDirection('ArrowUp')"
                        onmouseup="releaseDirection('ArrowUp')"
                        onmouseleave="releaseDirection('ArrowUp')">
                        ↑
                    </button>

                    <!--
                        첫 번째 줄 오른쪽 빈칸
                    -->
                    <button class="empty">.</button>


                    <!--
                        왼쪽 이동 버튼

                        ArrowLeft는 왼쪽 방향키를 의미한다.

                        마우스를 누르면 왼쪽 방향 입력을 시작하고,
                        놓거나 버튼에서 벗어나면 입력을 해제한다.
                    -->
                    <button
                        onmousedown="pressDirection('ArrowLeft')"
                        onmouseup="releaseDirection('ArrowLeft')"
                        onmouseleave="releaseDirection('ArrowLeft')">
                        ←
                    </button>


                    <!--
                        중앙 상호작용 버튼

                        class="dpad-action"
                        : 중앙 버튼에 적용할 CSS 스타일

                        onclick="interact()"
                        : 클릭하면 interact() 함수를 호출한다.

                        게임 속 물체와의 상호작용 등에
                        사용할 수 있도록 연결된 버튼이다.

                        실제 상호작용의 조건과 결과는
                        JavaScript에서 결정한다.
                    -->
                    <button
                        class="dpad-action"
                        onclick="interact()">
                        ◎
                    </button>


                    <!--
                        오른쪽 이동 버튼

                        ArrowRight는 오른쪽 방향키를 의미한다.

                        pressDirection()
                        : 방향 입력 시작

                        releaseDirection()
                        : 방향 입력 해제
                    -->
                    <button
                        onmousedown="pressDirection('ArrowRight')"
                        onmouseup="releaseDirection('ArrowRight')"
                        onmouseleave="releaseDirection('ArrowRight')">
                        →
                    </button>


                    <!--
                        세 번째 줄 왼쪽 빈칸
                    -->
                    <button class="empty">.</button>


                    <!--
                        아래쪽 이동 버튼

                        ArrowDown은 아래쪽 방향키를 의미한다.

                        버튼을 누르면 아래쪽 방향 입력을 시작하고,
                        놓거나 버튼 영역에서 벗어나면 해제한다.
                    -->
                    <button
                        onmousedown="pressDirection('ArrowDown')"
                        onmouseup="releaseDirection('ArrowDown')"
                        onmouseleave="releaseDirection('ArrowDown')">
                        ↓
                    </button>


                    <!--
                        세 번째 줄 오른쪽 빈칸
                    -->
                    <button class="empty">.</button>

                </div>

            </div>


            <!-- =================================================
                 프롤로그
            ================================================== -->

            <!--
                =================================================
                7. 게임 시작 전 프롤로그 안내창
                =================================================

                id="prologueOverlay"

                사용자가 본격적으로 게임을 시작하기 전에
                게임 규칙과 조작 방법 등을 확인할 수 있도록
                구성한 프롤로그 영역이다.

                일반적인 안내 문구뿐 아니라
                페이지 번호, 제목, 설명, 그림,
                이전 및 다음 버튼을 포함한다.

                프롤로그를 여러 페이지로 나누어
                단계적으로 안내할 수 있는 구조이다.
            -->
            <div id="prologueOverlay">

                <!--
                    프롤로그 내용 전체를 감싸는 영역

                    class="prologue-box"

                    안내창의 크기, 배경, 테두리,
                    여백 등을 CSS에서 설정할 수 있다.
                -->
                <div class="prologue-box">


                    <!--
                        -----------------------------------------
                        7-1. 프롤로그 상단 정보
                        -----------------------------------------

                        안내창의 상단에 표시되는
                        가이드 이름과 페이지 번호를 묶는다.
                    -->
                    <div class="prologue-top">

                        <!--
                            프롤로그 가이드 제목

                            NIGHT SHIFT GUIDE는
                            게임의 조작 및 진행 방법을
                            안내하는 화면임을 나타낸다.
                        -->
                        <div class="prologue-stage">
                            NIGHT SHIFT GUIDE
                        </div>

                        <!--
                            프롤로그 페이지 번호

                            id="prologuePageNumber"

                            현재 몇 번째 안내 페이지를
                            보고 있는지 표시하는 요소이다.

                            초기 텍스트는 1 / 5이며,
                            총 5페이지의 안내를 전제로 한다.

                            JavaScript에서 이 요소의 내용을
                            변경하면 페이지 번호를 갱신할 수 있다.
                        -->
                        <div
                            class="prologue-stage"
                            id="prologuePageNumber">
                            1 / 5
                        </div>

                    </div>


                    <!--
                        -----------------------------------------
                        7-2. 프롤로그 페이지 제목
                        -----------------------------------------

                        id="prologueTitle"

                        현재 프롤로그 페이지의 제목을
                        표시하기 위한 영역이다.

                        HTML에는 제목이 고정되어 있지 않다.

                        JavaScript에서 페이지에 맞는
                        제목을 삽입할 수 있도록
                        빈 요소로 구성되어 있다.
                    -->
                    <div
                        class="prologue-title"
                        id="prologueTitle">
                    </div>


                    <!--
                        -----------------------------------------
                        7-3. 프롤로그 설명 문구
                        -----------------------------------------

                        id="prologueText"

                        게임 규칙이나 조작 방법 등을
                        문장으로 설명하는 영역이다.

                        페이지에 따라 다른 설명을
                        표시할 수 있도록 준비되어 있다.

                        실제 문구의 설정과 변경은
                        JavaScript에서 처리할 수 있다.
                    -->
                    <div
                        class="prologue-text"
                        id="prologueText">
                    </div>


                    <!--
                    프롤로그에서 게임 속 물체를
                    실제 도트 스프라이트로 보여주는 Canvas
                    -->

                    <!--
                        -----------------------------------------
                        7-4. 프롤로그 그림 표시 캔버스
                        -----------------------------------------

                        id="tutorialCanvas"

                        게임에 등장하는 캐릭터나 물체를
                        그림으로 설명하기 위한 캔버스이다.

                        일반적인 이미지 태그와 달리
                        canvas는 JavaScript를 이용하여
                        내부에 그래픽을 그릴 수 있다.

                        width="780"
                        : 캔버스 내부 가로 해상도 780픽셀

                        height="245"
                        : 캔버스 내부 세로 해상도 245픽셀

                        게임의 메인 캔버스와는 별도로
                        존재하는 안내용 캔버스이다.

                        따라서 메인 게임 화면과
                        프롤로그 설명 그림을
                        서로 다른 영역에서 표현할 수 있다.
                    -->
                    <canvas
                        id="tutorialCanvas"
                        width="780"
                        height="245">
                    </canvas>


                    <!--
                        -----------------------------------------
                        7-5. 프롤로그 추가 팁
                        -----------------------------------------

                        id="tutorialTip"

                        프롤로그의 주요 설명 외에
                        추가적인 조작 팁이나 주의사항을
                        표시하기 위한 영역이다.

                        JavaScript에서 페이지에 맞는
                        팁을 삽입할 수 있다.
                    -->
                    <div
                        class="tutorial-tip"
                        id="tutorialTip">
                    </div>


                    <!--
                        -----------------------------------------
                        7-6. 프롤로그 페이지 이동 버튼
                        -----------------------------------------

                        class="prologue-buttons"

                        이전 페이지와 다음 페이지로
                        이동하는 버튼을 묶는 영역이다.
                    -->
                    <div class="prologue-buttons">

                        <!--
                            이전 페이지 버튼

                            class="secondary-button"
                            : 보조 버튼 디자인에 사용되는 클래스

                            id="previousTutorialButton"
                            : JavaScript에서 버튼을 찾아
                              상태나 문구 등을 제어할 수 있는 ID

                            onclick="previousTutorialPage()"
                            : 클릭하면 이전 페이지 이동을
                              담당하는 함수를 호출한다.

                            첫 페이지에서의 버튼 처리 방식은
                            JavaScript 코드에 따라 결정된다.
                        -->
                        <button
                            class="secondary-button"
                            id="previousTutorialButton"
                            onclick="previousTutorialPage()">

                            ← 이전

                        </button>


                        <!--
                            다음 페이지 버튼

                            id="nextTutorialButton"
                            : JavaScript에서 버튼을 찾아
                              제어할 수 있도록 지정한 ID

                            onclick="nextTutorialPage()"
                            : 클릭하면 다음 페이지 이동을
                              담당하는 함수를 호출한다.

                            마지막 페이지에서 게임을 시작하는지,
                            버튼 문구가 변경되는지 등의 동작은
                            JavaScript에서 확인해야 한다.
                        -->
                        <button
                            id="nextTutorialButton"
                            onclick="nextTutorialPage()">

                            다음 →

                        </button>

                    </div>


                </div>

            </div>


        </div>


        <!-- =====================================================
             오른쪽 상태창
        ====================================================== -->

        <!--
            =====================================================
            8. 오른쪽 게임 정보 패널
            =====================================================

            class="side"

            게임 플레이 중 필요한 정보를
            한곳에 모아서 보여주는 영역이다.

            내부에는 여러 개의 card가 존재한다.

            각 카드는 다음과 같은 정보를 담당한다.

            1. 현재 스테이지
            2. 미션
            3. 플레이어 상태
            4. 진행 상황
            5. 야간 기록

            이 영역을 통해 사용자는 게임 화면 외에도
            현재 상황을 확인할 수 있다.
        -->
        <div class="side">


            <!--
                =================================================
                8-1. 현재 스테이지 카드
                =================================================

                class="card"

                카드 형태의 정보 영역을 생성한다.

                여러 정보창에 같은 card 클래스를
                사용하면 CSS 디자인을 통일할 수 있다.
            -->
            <div class="card">

                <!--
                    카드 제목

                    h3는 HTML의 제목 태그 중 하나이다.

                    현재 카드가 어떤 정보를 표시하는지
                    사용자에게 알려준다.
                -->
                <h3>

                    <!--
                        스프라이트 아이콘 표시용 요소

                        data-sprite="icon_cross"
                        : 표시할 스프라이트를 식별하기 위한
                          사용자 정의 데이터 속성이다.

                        data-scale="2"
                        : 스프라이트 표시 크기와 관련된
                          데이터 값으로 사용할 수 있다.

                        data-* 속성은 HTML에서
                        사용자 정의 데이터를 저장하는 방식이다.

                        실제로 이 데이터를 읽어
                        그림을 표시하는 기능은
                        JavaScript 또는 관련 코드에 의해
                        구현되어야 한다.
                    -->
                    <span data-sprite="icon_cross" data-scale="2"></span>
                    현재 스테이지
                </h3>

                <!--
                    현재 스테이지 정보 표시 영역

                    id="stageBox"

                    현재 진행 중인 스테이지에 대한
                    정보를 표시하기 위한 공간이다.

                    초기에는 프롤로그 안내 문구가 들어 있다.

                    게임이 진행되면서 JavaScript에서
                    내용을 변경할 수 있도록 구성되어 있다.
                -->
                <div
                    class="stage-card"
                    id="stageBox">
                    프롤로그를 넘기면 근무가 시작됩니다.
                </div>

            </div>


            <!--
                =================================================
                8-2. 미션 카드
                =================================================

                현재 스테이지에서 수행해야 하는
                목표를 안내하기 위한 영역이다.
            -->
            <div class="card">

                <h3>

                    <!--
                        미션 카드 아이콘

                        icon_target이라는 이름의
                        스프라이트를 지정한다.

                        data-scale 값은 2로 설정되어 있다.
                    -->
                    <span data-sprite="icon_target" data-scale="2"></span>
                    미션
                </h3>

                <!--
                    미션 설명 표시 영역

                    class="objective"
                    : 미션 설명에 적용할 CSS 스타일

                    id="objectiveBox"
                    : JavaScript에서 미션 문구를
                      찾아 변경할 수 있도록 하는 ID

                    초기 내용은 "-"이며,
                    실제 미션 내용은 별도로 설정할 수 있다.
                -->
                <div
                    class="objective"
                    id="objectiveBox">
                    -
                </div>

            </div>


            <!--
                =================================================
                8-3. 플레이어 상태 카드
                =================================================

                게임 속 플레이어의 현재 상태를
                표시하기 위한 영역이다.

                어떤 상태 정보가 표시되는지는
                JavaScript 구현에 따라 결정된다.
            -->
            <div class="card">

                <h3>

                    <!--
                        상태 카드 아이콘

                        heart라는 스프라이트를 지정한다.

                        하트 이미지를 상태 표시용
                        아이콘으로 사용할 수 있다.
                    -->
                    <span data-sprite="heart" data-scale="2"></span>
                    상태
                </h3>

                <!--
                    상태 정보 표시 영역

                    id="statusBox"

                    플레이어의 현재 상태를
                    표시하기 위해 준비된 공간이다.

                    초기 HTML에는 내용이 없으며,
                    JavaScript가 상태 정보를
                    추가하거나 갱신할 수 있다.
                -->
                <div id="statusBox">
                </div>

            </div>


            <!--
                =================================================
                8-4. 게임 진행 상황 카드
                =================================================

                게임의 진행 정도를 사용자에게
                보여주기 위한 영역이다.
            -->
            <div class="card">

                <!--
                    진행 상황 카드 제목

                    id="progressTitle"

                    JavaScript에서 제목 요소를 찾아
                    변경할 수 있도록 ID를 지정하였다.

                    초기 제목은 "진행"이다.
                -->
                <h3 id="progressTitle">
                    진행
                </h3>

                <!--
                    진행 상황 표시 영역

                    id="progressBox"

                    스테이지 진행에 관련된 정보를
                    표시하기 위한 공간이다.

                    실제 표시되는 정보의 종류와 형식은
                    JavaScript에서 결정할 수 있다.

                    초기에는 빈 상태이다.
                -->
                <div id="progressBox">
                </div>

            </div>


            <!--
                =================================================
                8-5. 야간 기록 카드
                =================================================

                게임에서 발생한 사건이나 안내 내용을
                기록 형태로 보여주기 위한 영역이다.

                class="card log-card"

                하나의 요소에 두 개의 클래스를 적용하였다.

                card
                : 공통 카드 디자인에 사용

                log-card
                : 기록 카드에 별도로 적용할
                  디자인을 지정할 때 사용

                여러 클래스는 공백으로 구분한다.
            -->
            <div class="card log-card">

                <h3>

                    <!--
                        야간 기록 카드 아이콘

                        icon_doc이라는 스프라이트를
                        표시하도록 지정한다.
                    -->
                    <span data-sprite="icon_doc" data-scale="2"></span>
                    야간 기록
                </h3>

                <!--
                    게임 기록 표시 영역

                    id="logBox"

                    게임 진행 중 발생하는 기록을
                    표시하기 위한 공간이다.

                    예를 들어 게임의 특정 이벤트가
                    발생했을 때 JavaScript에서
                    이 영역에 기록을 추가할 수 있다.

                    실제 기록의 생성 방식과 내용은
                    JavaScript 코드에서 결정된다.
                -->
                <div id="logBox">
                </div>

            </div>


        </div>


    </div>

</div>


<!--
    ============================================================
    9. 외부 JavaScript 파일 불러오기
    ============================================================

    script 태그는 JavaScript 코드를 실행하거나
    외부 JavaScript 파일을 불러올 때 사용한다.

    src 속성에는 불러올 파일의 경로를 작성한다.

    현재 HTML에서는 다음 순서로 파일을 불러온다.

    1. assets/atlas.js
    2. sprites.js
    3. script.js

    일반적인 defer 또는 async 속성이 없는
    외부 script 태그는 작성된 순서대로 처리된다.

    따라서 앞에서 불러온 파일에 정의된
    변수나 함수 등을 뒤의 파일에서
    사용할 수 있는 구조를 만들 수 있다.

    단, 실제 파일 사이의 의존 관계는
    각 JavaScript 파일의 내용을 확인해야 한다.

    또한 이 script 태그들은 body의 끝부분에 있어
    위쪽 HTML 요소들이 작성된 이후 실행된다.
-->

<!--
    9-1. 스프라이트 아틀라스 관련 파일

    assets 폴더 내부의 atlas.js를 불러온다.

    아틀라스는 여러 그래픽 데이터를
    하나로 관리하는 데 사용되는 개념이다.

    실제 데이터 구조와 역할은
    atlas.js 파일의 구현에 따라 결정된다.
-->
<script src="assets/atlas.js"></script>

<!--
    9-2. 스프라이트 관련 JavaScript 파일

    sprites.js를 불러온다.

    게임에서 사용하는 스프라이트의
    처리 및 표시와 관련된 코드가
    들어갈 수 있는 파일이다.

    실제 기능은 해당 파일의 내용을
    확인해야 정확히 알 수 있다.
-->
<script src="sprites.js"></script>

<!--
    9-3. 게임 메인 JavaScript 파일

    script.js를 불러온다.

    HTML에 연결된 다음 함수들은
    JavaScript에서 정의되어 있어야 한다.

    restartStage()
    : 현재 스테이지 재시작 버튼에서 호출

    pressDirection()
    : 방향 버튼을 누를 때 호출

    releaseDirection()
    : 방향 버튼을 놓거나 벗어날 때 호출

    interact()
    : 중앙 상호작용 버튼에서 호출

    previousTutorialPage()
    : 프롤로그 이전 버튼에서 호출

    nextTutorialPage()
    : 프롤로그 다음 버튼에서 호출

    이 파일의 실제 내용을 확인하면
    캐릭터 이동, 미션 진행, 충돌 판정 등
    게임 기능이 어떤 방식으로 구현되었는지
    구체적으로 분석할 수 있다.
-->
<script src="script.js"></script>

<!--
    ============================================================
    10. HTML 전체 구조 정리
    ============================================================

    [HTML의 주요 역할]

    1. 게임 화면 생성
       - canvas를 이용해 게임 그래픽 표시 영역 마련

    2. 사용자 조작 인터페이스 구성
       - 키보드 조작 방법 안내
       - 화면 방향 버튼 제공
       - 상호작용 및 재시작 버튼 제공

    3. 프롤로그 구성
       - 페이지별 제목과 설명 표시 영역
       - 안내용 canvas
       - 이전 및 다음 페이지 버튼

    4. 게임 정보 표시
       - 현재 스테이지
       - 미션
       - 플레이어 상태
       - 진행 상황
       - 야간 기록

    5. JavaScript 연결
       - 버튼 클릭 시 함수 호출
       - 게임 정보가 표시될 HTML 요소 제공
       - 외부 JavaScript 파일 불러오기

    [핵심 개념]

    HTML
    : 웹페이지의 구조를 정의한다.

    CSS
    : 웹페이지의 디자인과 배치를 담당한다.

    JavaScript
    : 게임의 동작과 사용자 입력을 처리한다.

    Canvas
    : JavaScript가 그래픽을 그릴 수 있는 영역이다.

    ID
    : 특정 HTML 요소를 식별하기 위해 사용한다.

    Class
    : 여러 HTML 요소에 공통 스타일을 적용할 때
      주로 사용한다.

    Event
    : 클릭, 키 누름, 마우스 이동 등
      사용자의 동작에 따라 발생하는 사건이다.

    Function
    : 특정 기능을 수행하도록 작성한 코드의 묶음이다.
